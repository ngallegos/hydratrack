name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Generated *.g.dart / *.freezed.dart files are committed, so fail if
      # they are out of date with the sources that produce them.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
